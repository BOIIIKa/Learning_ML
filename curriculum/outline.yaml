# 课程大纲唯一数据源 / Single source of truth for the curriculum outline.
#
# - 每个可读字段都是 {zh, en} 双语对象，前端据此做语言切换。
#   Every human-readable field is a {zh, en} pair; the frontend switches on it.
# - 章节只记录“我们自己的”讲解要点与可视化设计；sources 只引用章号，不摘录原文。
#   Chapters hold our own teaching points and visual designs; `sources` cites
#   chapter numbers only and never quotes the books.
# - 修改后运行 `python3 scripts/build_outline.py` 重新生成 OUTLINE.*.md。
#   After editing, run `python3 scripts/build_outline.py` to regenerate OUTLINE.*.md.

meta:
  title:
    zh: "看得见的机器学习：从严谨推导到科研前沿"
    en: "Visible Machine Learning: From Rigorous Derivations to the Research Frontier"
  audience:
    zh: "具备微积分、线性代数、概率论基础，希望快速具备 ML 科研能力的学生"
    en: "Students comfortable with calculus, linear algebra and probability who want to build ML research ability quickly"
  license:
    zh: "内容以 CC BY-NC-SA 4.0 发布，代码以 MIT 发布；不复制原书文字与插图"
    en: "Content under CC BY-NC-SA 4.0, code under MIT; no text or figures are copied from the source books"

books:
  ISL:
    title: "An Introduction to Statistical Learning (2nd ed. / Python ed.)"
    authors: "James, Witten, Hastie, Tibshirani, Taylor"
    url: "https://www.statlearning.com/"
    chapters: 13
    omitted:
      "1": {zh: "导论，并入第 01 章", en: "Introduction, folded into Ch. 01"}
      "11": {zh: "生存分析：偏应用统计，暂不纳入主线", en: "Survival analysis: applied-statistics topic, outside the main line for now"}
  UDL:
    title: "Understanding Deep Learning"
    authors: "Simon J. D. Prince"
    url: "https://udlbook.github.io/udlbook/"
    chapters: 21
    omitted:
      "1": {zh: "导论，并入第 01 章", en: "Introduction, folded into Ch. 01"}
  LH:
    title: "统计学习方法（第 2 版）/ Statistical Learning Methods (2nd ed.)"
    authors: "李航 / Li Hang"
    url: "https://book.douban.com/subject/33437381/"
    chapters: 22
    omitted:
      "12": {zh: "监督学习方法总结：由网站的交叉索引视图取代", en: "Summary of supervised methods: replaced by the site's cross-index views"}
      "22": {zh: "无监督学习方法总结：由网站的交叉索引视图取代", en: "Summary of unsupervised methods: replaced by the site's cross-index views"}

# 交叉索引标签：目录按“部分”排序，同时每章打上任务 / 策略 / 算法标签，
# 前端可一键切换为“按任务”“按损失”“按优化算法”视图。
# Cross-index tags: the TOC is ordered by part, and each chapter is tagged by
# task / strategy / algorithm so the frontend can re-sort into alternative views.
tags:
  task:
    regression: {zh: "回归", en: "Regression"}
    classification: {zh: "分类", en: "Classification"}
    sequence: {zh: "序列标注", en: "Sequence labeling"}
    clustering: {zh: "聚类", en: "Clustering"}
    dim-reduction: {zh: "降维", en: "Dimensionality reduction"}
    density: {zh: "密度估计", en: "Density estimation"}
    generation: {zh: "生成", en: "Generation"}
    ranking: {zh: "排序", en: "Ranking"}
    decision: {zh: "序贯决策", en: "Sequential decision-making"}
    graph: {zh: "图数据", en: "Graph data"}
  strategy:
    squared: {zh: "平方损失", en: "Squared loss"}
    cross-entropy: {zh: "交叉熵 / 对数似然", en: "Cross-entropy / log-likelihood"}
    perceptron: {zh: "感知机损失", en: "Perceptron loss"}
    hinge: {zh: "合页损失", en: "Hinge loss"}
    exponential: {zh: "指数损失", en: "Exponential loss"}
    impurity: {zh: "不纯度（熵 / 基尼）", en: "Impurity (entropy / Gini)"}
    max-entropy: {zh: "最大熵", en: "Maximum entropy"}
    likelihood: {zh: "（边缘）似然", en: "(Marginal) likelihood"}
    elbo: {zh: "证据下界 ELBO", en: "Evidence lower bound (ELBO)"}
    reconstruction: {zh: "重构误差", en: "Reconstruction error"}
    within-cluster: {zh: "簇内平方和", en: "Within-cluster sum of squares"}
    adversarial: {zh: "对抗损失", en: "Adversarial loss"}
    denoising: {zh: "去噪 / 得分匹配", en: "Denoising / score matching"}
    reward: {zh: "期望回报", en: "Expected return"}
    regularization: {zh: "正则化 / 结构风险", en: "Regularization / structural risk"}
  algorithm:
    closed-form: {zh: "闭式解", en: "Closed form"}
    gd: {zh: "梯度下降", en: "Gradient descent"}
    sgd: {zh: "随机梯度下降", en: "Stochastic gradient descent"}
    adam: {zh: "自适应优化（Adam 等）", en: "Adaptive methods (Adam etc.)"}
    newton: {zh: "牛顿 / 拟牛顿法", en: "Newton / quasi-Newton"}
    coordinate: {zh: "坐标下降", en: "Coordinate descent"}
    dual-qp: {zh: "对偶与二次规划（SMO）", en: "Duality & QP (SMO)"}
    greedy: {zh: "贪心划分", en: "Greedy splitting"}
    stagewise: {zh: "前向分步加法", en: "Forward stagewise additive"}
    dp: {zh: "动态规划", en: "Dynamic programming"}
    em: {zh: "EM 算法", en: "EM algorithm"}
    lloyd: {zh: "交替最小化（Lloyd）", en: "Alternating minimization (Lloyd)"}
    eigen: {zh: "特征分解 / SVD", en: "Eigendecomposition / SVD"}
    mcmc: {zh: "MCMC 采样", en: "MCMC sampling"}
    power-iteration: {zh: "幂迭代", en: "Power iteration"}
    backprop: {zh: "反向传播", en: "Backpropagation"}
    policy-gradient: {zh: "策略梯度", en: "Policy gradient"}

parts:
  # ───────────────────────────────────────────────────────────────── P0
  - id: P0
    title: {zh: "预备：数学工具箱", en: "Prelude: The Mathematical Toolkit"}
    summary:
      zh: "只讲后文真正用到的数学，并且全部用几何图像建立直觉。"
      en: "Only the mathematics the rest of the course uses, each built from a geometric picture."
    chapters:
      - id: "00"
        slug: math-toolkit
        title: {zh: "线性代数、概率与优化的几何直觉", en: "Geometric Intuition for Linear Algebra, Probability and Optimization"}
        paradigm: foundation
        sources: {UDL: ["App. B", "App. C"], LH: ["附录 A–E"]}
        prereqs: []
        tags: {task: [], strategy: [], algorithm: [gd, newton]}
        goals:
          - zh: "把矩阵看成线性变换，把 SVD 看成“旋转–缩放–旋转”"
            en: "See matrices as linear maps and the SVD as rotate–scale–rotate"
          - zh: "掌握 MLE / MAP、KL 散度、Jensen 不等式三件套"
            en: "Master the trio of MLE / MAP, KL divergence and Jensen's inequality"
          - zh: "理解凸性、梯度、Hessian 与拉格朗日对偶 / KKT 条件"
            en: "Understand convexity, gradients, the Hessian, and Lagrangian duality / KKT conditions"
        derivations:
          - zh: "多元高斯的 MLE；协方差矩阵的特征分解与等高线椭圆"
            en: "MLE for the multivariate Gaussian; eigendecomposition of the covariance and its contour ellipses"
          - zh: "由 Jensen 不等式推出 KL 散度非负"
            en: "Non-negativity of KL divergence via Jensen's inequality"
          - zh: "拉格朗日对偶：弱对偶、强对偶与 KKT 的几何含义"
            en: "Lagrangian duality: weak/strong duality and the geometry of KKT"
        visuals:
          - id: viz-linear-map
            title: {zh: "矩阵是一个变换", en: "A matrix is a transformation"}
            interaction:
              zh: "拖动 2×2 矩阵的四个元素，看单位网格与单位圆如何变形，同步显示 SVD 三步分解"
              en: "Drag the four entries of a 2×2 matrix to warp a unit grid and circle, with the three-step SVD shown alongside"
          - id: viz-gaussian-mle
            title: {zh: "高斯拟合与似然曲面", en: "Gaussian fitting and the likelihood surface"}
            interaction:
              zh: "在平面上点选数据点，实时更新 MLE 均值与协方差椭圆，并显示对数似然曲面"
              en: "Click to add points; the MLE mean and covariance ellipse update live next to the log-likelihood surface"
          - id: viz-kkt
            title: {zh: "约束优化与 KKT", en: "Constrained optimization and KKT"}
            interaction:
              zh: "拖动约束边界，观察最优点在内部 / 边界切换时乘子何时为零（互补松弛）"
              en: "Drag the constraint boundary and see when the multiplier hits zero as the optimum moves between interior and boundary (complementary slackness)"
        frontier: []

  # ───────────────────────────────────────────────────────────────── P1
  - id: P1
    title: {zh: "第一部分：学习的框架", en: "Part I: The Framework of Learning"}
    summary:
      zh: "引入贯穿全书的“模型–策略–算法”三元组，以及泛化这一核心问题。"
      en: "Introduces the model–strategy–algorithm triad used in every chapter, and generalization as the central question."
    chapters:
      - id: "01"
        slug: learning-triad
        title: {zh: "学习问题与三要素：模型、策略、算法", en: "The Learning Problem: Model, Strategy, Algorithm"}
        paradigm: foundation
        sources: {ISL: ["2"], UDL: ["2"], LH: ["1"]}
        prereqs: ["00"]
        tags: {task: [regression, classification], strategy: [squared, regularization], algorithm: [closed-form, gd]}
        goals:
          - zh: "区分假设空间、损失 / 风险、优化算法这三个独立选择"
            en: "Separate the three independent choices: hypothesis space, loss / risk, optimizer"
          - zh: "理解期望风险、经验风险与结构风险最小化"
            en: "Understand expected risk, empirical risk and structural risk minimization"
          - zh: "建立监督 / 无监督 / 强化学习与参数 / 非参数模型的分类坐标"
            en: "Place methods on two axes: supervised / unsupervised / RL and parametric / non-parametric"
        triad:
          model: {zh: "假设空间 $\\mathcal{F}$：函数族或条件分布族", en: "Hypothesis space $\\mathcal{F}$: a family of functions or conditional distributions"}
          strategy: {zh: "经验风险 + 正则项（结构风险）", en: "Empirical risk + regularizer (structural risk)"}
          algorithm: {zh: "求解上述最优化问题的数值方法", en: "The numerical method that solves the resulting optimization problem"}
        derivations:
          - zh: "平方损失下贝叶斯最优预测为条件期望 $E[Y|X]$"
            en: "Under squared loss the Bayes-optimal predictor is $E[Y|X]$"
          - zh: "0-1 损失下贝叶斯分类器与贝叶斯错误率"
            en: "Under 0-1 loss: the Bayes classifier and the Bayes error rate"
        visuals:
          - id: viz-triad-explorer
            title: {zh: "三要素组合器", en: "Triad composer"}
            interaction:
              zh: "从三个下拉菜单分别选模型、损失、优化器，在同一数据集上看训练动画；展示全书所有算法都是这三者的组合"
              en: "Pick a model, a loss and an optimizer from three menus and watch training on one dataset — every algorithm in the course is one such combination"
          - id: viz-risk-gap
            title: {zh: "经验风险 vs 期望风险", en: "Empirical vs expected risk"}
            interaction:
              zh: "调节样本量 n，观察经验风险曲线如何逼近真实风险曲线"
              en: "Change sample size n and watch the empirical risk curve approach the true risk curve"
        frontier: []

      - id: "02"
        slug: generalization
        title: {zh: "泛化、偏差–方差与模型选择", en: "Generalization, Bias–Variance and Model Selection"}
        paradigm: foundation
        sources: {ISL: ["2", "5"], UDL: ["8"], LH: ["1"]}
        prereqs: ["01"]
        tags: {task: [regression, classification], strategy: [regularization], algorithm: []}
        goals:
          - zh: "推导偏差–方差分解并理解经典 U 形曲线"
            en: "Derive the bias–variance decomposition and the classical U-shaped curve"
          - zh: "掌握留出法、k 折交叉验证与自助法"
            en: "Master hold-out, k-fold cross-validation and the bootstrap"
          - zh: "认识现代“双下降”现象，知道经典理论在哪里失效"
            en: "Meet modern double descent and see where classical theory breaks down"
        triad:
          model: {zh: "一族复杂度递增的模型", en: "A nested family of models of increasing complexity"}
          strategy: {zh: "用验证误差估计泛化误差", en: "Estimate generalization error with validation error"}
          algorithm: {zh: "交叉验证 / 自助法", en: "Cross-validation / bootstrap"}
        derivations:
          - zh: "平方损失下 期望误差 = 偏差² + 方差 + 噪声"
            en: "Under squared loss: expected error = bias² + variance + noise"
          - zh: "有限假设空间的泛化误差上界（Hoeffding + 联合界）"
            en: "Generalization bound for a finite hypothesis space (Hoeffding + union bound)"
          - zh: "k 折交叉验证估计量的偏差与方差权衡"
            en: "The bias–variance trade-off of the k-fold CV estimator itself"
        visuals:
          - id: viz-bias-variance
            title: {zh: "偏差–方差模拟器", en: "Bias–variance simulator"}
            interaction:
              zh: "反复重采样训练集并叠加拟合曲线，拖动多项式阶数，实时拆分误差三部分"
              en: "Resample training sets, overlay the fitted curves, drag polynomial degree, and see the error split into three parts live"
          - id: viz-double-descent
            title: {zh: "双下降", en: "Double descent"}
            interaction:
              zh: "用随机特征回归扫描参数量越过插值阈值 p = n，观察测试误差先升后降"
              en: "Sweep the number of random features past the interpolation threshold p = n and watch test error rise then fall again"
          - id: viz-cv-folds
            title: {zh: "交叉验证的折", en: "Folds of cross-validation"}
            interaction:
              zh: "动画演示 k 折划分；调节 k 观察 CV 估计的均值与方差"
              en: "Animate k-fold splits; vary k to see the mean and variance of the CV estimate"
        frontier:
          - ref: "Belkin, Hsu, Ma, Mandal (2019). Reconciling modern machine-learning practice and the classical bias–variance trade-off. PNAS."
            note: {zh: "提出双下降曲线", en: "Introduced the double-descent curve"}
          - ref: "Nakkiran et al. (2020). Deep Double Descent. ICLR."
            note: {zh: "在深度网络中系统验证双下降（模型 / 样本 / 训练轮数）", en: "Systematic double descent in deep nets across model size, data and epochs"}
          - ref: "Zhang, Bengio, Hardt, Recht, Vinyals (2017). Understanding deep learning requires rethinking generalization. ICLR."
            note: {zh: "网络可拟合随机标签：对经典复杂度理论的挑战", en: "Networks fit random labels — a challenge to classical complexity theory"}

  # ───────────────────────────────────────────────────────────────── P2
  - id: P2
    title: {zh: "第二部分：监督学习的经典模型", en: "Part II: Classical Supervised Learning"}
    summary:
      zh: "以李航的严谨推导为骨架、ISL 的统计视角为血肉，每个模型都拆成三要素讲。"
      en: "Li Hang's rigorous derivations as the skeleton and ISL's statistical view as the flesh; every model is dissected into the triad."
    chapters:
      - id: "03"
        slug: linear-regression
        title: {zh: "线性回归与正则化", en: "Linear Regression and Regularization"}
        paradigm: supervised
        sources: {ISL: ["3", "6"], UDL: ["2"]}
        prereqs: ["02"]
        tags: {task: [regression], strategy: [squared, regularization], algorithm: [closed-form, coordinate, gd]}
        goals:
          - zh: "从投影几何与高斯 MLE 两个角度理解最小二乘"
            en: "Understand least squares both as a projection and as Gaussian MLE"
          - zh: "理解岭回归与 Lasso 的几何差异以及 Lasso 为何产生稀疏解"
            en: "See the geometric difference between ridge and lasso, and why lasso gives sparse solutions"
          - zh: "把正则化解释为先验（MAP）"
            en: "Interpret regularization as a prior (MAP)"
        triad:
          model: {zh: "$f(x)=w^\\top x+b$", en: "$f(x)=w^\\top x+b$"}
          strategy: {zh: "平方损失 + L2 / L1 惩罚", en: "Squared loss + L2 / L1 penalty"}
          algorithm: {zh: "正规方程 / 坐标下降（软阈值）/ 梯度下降", en: "Normal equations / coordinate descent (soft thresholding) / gradient descent"}
        derivations:
          - zh: "正规方程与帽子矩阵：$\\hat y$ 是 $y$ 在列空间上的正交投影"
            en: "Normal equations and the hat matrix: $\\hat y$ is the orthogonal projection of $y$ onto the column space"
          - zh: "岭回归闭式解及其在 SVD 基下的收缩因子 $d_j^2/(d_j^2+\\lambda)$"
            en: "Ridge closed form and its shrinkage factors $d_j^2/(d_j^2+\\lambda)$ in the SVD basis"
          - zh: "Lasso 次梯度最优性条件与软阈值算子"
            en: "Lasso subgradient optimality and the soft-thresholding operator"
          - zh: "高斯先验 ⇒ 岭回归；拉普拉斯先验 ⇒ Lasso"
            en: "Gaussian prior ⇒ ridge; Laplace prior ⇒ lasso"
        visuals:
          - id: viz-projection-3d
            title: {zh: "最小二乘即投影", en: "Least squares is projection"}
            interaction:
              zh: "3D 视图中拖动向量 y，观察其在列空间平面上的投影与正交残差"
              en: "In 3D, drag the vector y and watch its projection onto the column-space plane and the orthogonal residual"
          - id: viz-l1-l2-geometry
            title: {zh: "L1 与 L2 的几何", en: "Geometry of L1 vs L2"}
            interaction:
              zh: "拖动损失等高线中心，观察其与菱形 / 圆形约束域的切点，L1 为何常落在坐标轴上"
              en: "Drag the centre of the loss contours and see where they touch the diamond / disc — why L1 lands on the axes"
          - id: viz-reg-path
            title: {zh: "正则化路径", en: "Regularization path"}
            interaction:
              zh: "拖动 λ 滑块，同步更新系数路径图、拟合曲线与交叉验证误差"
              en: "Slide λ to update the coefficient paths, the fitted curve and CV error together"
        frontier:
          - ref: "Tibshirani (1996). Regression Shrinkage and Selection via the Lasso. JRSS-B."
            note: {zh: "Lasso 原始论文", en: "The original lasso paper"}
          - ref: "Hastie, Montanari, Rosset, Tibshirani (2022). Surprises in high-dimensional ridgeless least squares interpolation. Annals of Statistics."
            note: {zh: "高维最小范数插值的精确风险：线性模型里的双下降", en: "Exact risk of minimum-norm interpolation: double descent in linear models"}

      - id: "04"
        slug: linear-classification
        title: {zh: "线性分类：感知机、逻辑回归与最大熵", en: "Linear Classification: Perceptron, Logistic Regression and Maximum Entropy"}
        paradigm: supervised
        sources: {ISL: ["4"], LH: ["2", "6"]}
        prereqs: ["03"]
        tags: {task: [classification], strategy: [perceptron, cross-entropy, max-entropy], algorithm: [sgd, newton]}
        goals:
          - zh: "掌握感知机的原始形式、对偶形式与收敛定理"
            en: "Master the perceptron's primal form, dual form and convergence theorem"
          - zh: "把逻辑回归同时看作伯努利 MLE 与交叉熵最小化"
            en: "View logistic regression as both Bernoulli MLE and cross-entropy minimization"
          - zh: "证明最大熵模型的对偶恰为多项逻辑回归（softmax）"
            en: "Show that the dual of the maximum-entropy model is multinomial logistic regression (softmax)"
        triad:
          model: {zh: "线性决策边界 $\\mathrm{sign}(w^\\top x+b)$ 或 $\\sigma(w^\\top x+b)$", en: "Linear boundary $\\mathrm{sign}(w^\\top x+b)$ or $\\sigma(w^\\top x+b)$"}
          strategy: {zh: "误分类点到超平面的距离和 / 负对数似然 / 最大熵", en: "Sum of distances of misclassified points / negative log-likelihood / maximum entropy"}
          algorithm: {zh: "随机梯度下降 / 牛顿法（IRLS）/ 改进的迭代尺度法", en: "SGD / Newton's method (IRLS) / improved iterative scaling"}
        derivations:
          - zh: "Novikoff 定理：线性可分时感知机误分类次数 $\\le (R/\\gamma)^2$"
            en: "Novikoff's theorem: on separable data the perceptron makes at most $(R/\\gamma)^2$ mistakes"
          - zh: "逻辑回归对数似然的梯度与 Hessian，证明其为凹函数"
            en: "Gradient and Hessian of the logistic log-likelihood; proof of concavity"
          - zh: "最大熵的拉格朗日对偶 ⇒ 指数族 / softmax 形式"
            en: "Lagrangian dual of maximum entropy ⇒ exponential-family / softmax form"
        visuals:
          - id: viz-perceptron-steps
            title: {zh: "感知机逐步更新", en: "Perceptron step by step"}
            interaction:
              zh: "逐步播放：高亮当前误分类点，显示 w 的更新向量与超平面旋转；可切换原始 / 对偶形式"
              en: "Step through: highlight the misclassified point, show the update vector and the rotating hyperplane; toggle primal / dual form"
          - id: viz-logistic-surface
            title: {zh: "逻辑回归的概率曲面", en: "The logistic probability surface"}
            interaction:
              zh: "拖动 w 与 b，3D 曲面与 2D 决策边界联动，并显示交叉熵损失数值"
              en: "Drag w and b; the 3D sigmoid surface, 2D boundary and cross-entropy loss update together"
          - id: viz-loss-zoo
            title: {zh: "分类损失动物园", en: "Zoo of classification losses"}
            interaction:
              zh: "在同一坐标系中对比 0-1、感知机、交叉熵、合页、指数损失关于间隔 $yf(x)$ 的曲线（与第 07、08 章联动）"
              en: "Plot 0-1, perceptron, cross-entropy, hinge and exponential losses against the margin $yf(x)$ (linked to Ch. 07 and 08)"
        frontier: []

      - id: "05"
        slug: generative-classifiers
        title: {zh: "生成式分类：朴素贝叶斯与判别分析", en: "Generative Classifiers: Naive Bayes and Discriminant Analysis"}
        paradigm: supervised
        sources: {ISL: ["4"], LH: ["4"]}
        prereqs: ["04"]
        tags: {task: [classification], strategy: [likelihood], algorithm: [closed-form]}
        goals:
          - zh: "理解生成式 $p(x,y)$ 与判别式 $p(y|x)$ 建模的根本差异"
            en: "Grasp the core difference between generative $p(x,y)$ and discriminative $p(y|x)$ modelling"
          - zh: "推导 LDA / QDA 的决策边界形状"
            en: "Derive the shape of LDA / QDA decision boundaries"
          - zh: "理解朴素贝叶斯的条件独立假设与拉普拉斯平滑"
            en: "Understand the naive Bayes independence assumption and Laplace smoothing"
        triad:
          model: {zh: "类先验 $p(y)$ × 类条件密度 $p(x|y)$", en: "Class prior $p(y)$ × class-conditional density $p(x|y)$"}
          strategy: {zh: "联合似然最大化（后验最大化决策）", en: "Maximize joint likelihood (decide by posterior)"}
          algorithm: {zh: "计数 / 闭式参数估计", en: "Counting / closed-form parameter estimates"}
        derivations:
          - zh: "共享协方差 ⇒ 线性边界（LDA）；不同协方差 ⇒ 二次边界（QDA）"
            en: "Shared covariance ⇒ linear boundary (LDA); separate covariances ⇒ quadratic boundary (QDA)"
          - zh: "LDA 的后验恰为逻辑回归形式——同一模型族、不同估计策略"
            en: "The LDA posterior has logistic form — same model family, different estimation strategy"
          - zh: "朴素贝叶斯的极大似然与贝叶斯估计（拉普拉斯平滑）"
            en: "Maximum-likelihood vs Bayesian estimates for naive Bayes (Laplace smoothing)"
        visuals:
          - id: viz-lda-qda
            title: {zh: "从高斯到边界", en: "From Gaussians to boundaries"}
            interaction:
              zh: "拖动两类高斯的均值与协方差椭圆，实时显示 LDA / QDA / 逻辑回归三条边界"
              en: "Drag the means and covariance ellipses of two Gaussians; LDA, QDA and logistic boundaries update live"
          - id: viz-gen-vs-disc
            title: {zh: "生成式 vs 判别式的样本效率", en: "Sample efficiency: generative vs discriminative"}
            interaction:
              zh: "调节训练样本量，比较朴素贝叶斯与逻辑回归的学习曲线交叉点"
              en: "Vary training size and compare the crossing learning curves of naive Bayes and logistic regression"
        frontier:
          - ref: "Ng & Jordan (2002). On Discriminative vs. Generative Classifiers: A comparison of logistic regression and naive Bayes. NeurIPS."
            note: {zh: "生成式收敛更快、判别式渐近误差更低", en: "Generative converges faster; discriminative has lower asymptotic error"}

      - id: "06"
        slug: nonparametric
        title: {zh: "非参数方法与基函数扩展：kNN、样条与 GAM", en: "Non-parametric Methods and Basis Expansions: kNN, Splines and GAMs"}
        paradigm: supervised
        sources: {ISL: ["2", "7"], LH: ["3"]}
        prereqs: ["02"]
        tags: {task: [classification, regression], strategy: [squared, regularization], algorithm: [closed-form]}
        goals:
          - zh: "理解 kNN 的三要素：距离度量、k 值、决策规则"
            en: "Understand kNN's three choices: distance metric, k, and decision rule"
          - zh: "掌握 kd 树的构造与搜索"
            en: "Master kd-tree construction and search"
          - zh: "用基函数扩展把线性模型变成非线性模型；理解维数灾难"
            en: "Turn linear models non-linear via basis expansions; understand the curse of dimensionality"
        triad:
          model: {zh: "局部平均 / 基函数线性组合", en: "Local averaging / linear combination of basis functions"}
          strategy: {zh: "多数表决（0-1 损失）/ 惩罚平方损失", en: "Majority vote (0-1 loss) / penalized squared loss"}
          algorithm: {zh: "kd 树检索 / 平滑样条闭式解", en: "kd-tree search / closed-form smoothing spline"}
        derivations:
          - zh: "1-NN 渐近误差不超过贝叶斯误差的两倍（Cover–Hart）"
            en: "The asymptotic 1-NN error is at most twice the Bayes error (Cover–Hart)"
          - zh: "高维球壳体积集中：维数灾难的定量刻画"
            en: "Volume concentration in high-dimensional shells: quantifying the curse of dimensionality"
          - zh: "三次样条的自由度与节点数关系"
            en: "Degrees of freedom of cubic splines as a function of knots"
        visuals:
          - id: viz-knn-boundary
            title: {zh: "k 值与决策边界", en: "k and the decision boundary"}
            interaction:
              zh: "拖动 k 滑块，边界从锯齿状逐步变平滑；切换 L1 / L2 / L∞ 距离"
              en: "Slide k from jagged to smooth boundaries; switch between L1 / L2 / L∞ distances"
          - id: viz-kdtree
            title: {zh: "kd 树的构造与最近邻搜索", en: "kd-tree construction and nearest-neighbour search"}
            interaction:
              zh: "动画逐层切分平面；点选查询点，回放回溯与剪枝过程"
              en: "Animate the recursive splits; click a query point to replay backtracking and pruning"
          - id: viz-curse-dim
            title: {zh: "维数灾难", en: "The curse of dimensionality"}
            interaction:
              zh: "调高维度 d，观察最近邻与最远邻距离之比趋于 1"
              en: "Raise dimension d and watch the nearest/farthest distance ratio approach 1"
        frontier: []

      - id: "07"
        slug: svm-kernels
        title: {zh: "支持向量机与核方法", en: "Support Vector Machines and Kernel Methods"}
        paradigm: supervised
        sources: {ISL: ["9"], LH: ["7"]}
        prereqs: ["00", "04"]
        tags: {task: [classification], strategy: [hinge, regularization], algorithm: [dual-qp]}
        goals:
          - zh: "从最大间隔原理完整推导硬 / 软间隔 SVM 及其对偶"
            en: "Fully derive hard / soft-margin SVMs and their duals from the max-margin principle"
          - zh: "理解核技巧、正定核与再生核希尔伯特空间的直觉"
            en: "Understand the kernel trick, positive-definite kernels and the intuition of an RKHS"
          - zh: "掌握 SMO 算法的两变量子问题"
            en: "Master SMO's two-variable subproblem"
        triad:
          model: {zh: "分离超平面（可经核映射到高维）", en: "Separating hyperplane (possibly in a kernel feature space)"}
          strategy: {zh: "间隔最大化 ⇔ 合页损失 + L2 正则", en: "Margin maximization ⇔ hinge loss + L2 regularization"}
          algorithm: {zh: "拉格朗日对偶 + SMO", en: "Lagrangian dual + SMO"}
        derivations:
          - zh: "几何间隔 → 凸二次规划原问题 → KKT → 对偶问题"
            en: "Geometric margin → convex QP primal → KKT → dual problem"
          - zh: "软间隔 SVM 等价于合页损失 + L2 正则的无约束问题"
            en: "Soft-margin SVM is equivalent to unconstrained hinge loss + L2 regularization"
          - zh: "Mercer 条件；常用核（多项式、RBF）对应的特征空间"
            en: "Mercer's condition; feature spaces of common kernels (polynomial, RBF)"
          - zh: "SMO：两变量解析更新与裁剪"
            en: "SMO: closed-form two-variable update and clipping"
        visuals:
          - id: viz-svm-margin
            title: {zh: "可拖拽的最大间隔", en: "Draggable maximum margin"}
            interaction:
              zh: "拖动数据点，实时重解 SVM；支持向量高亮，非支持向量移动时边界不变"
              en: "Drag points and re-solve the SVM live; support vectors light up, and moving non-support vectors leaves the boundary unchanged"
          - id: viz-kernel-lift
            title: {zh: "核映射：从 2D 升到 3D", en: "Kernel lifting: 2D to 3D"}
            interaction:
              zh: "同心圆数据经 $\\phi(x)=(x_1,x_2,x_1^2+x_2^2)$ 升维后被平面分开；调 RBF 带宽观察边界变化"
              en: "Concentric circles become separable after lifting by $\\phi(x)=(x_1,x_2,x_1^2+x_2^2)$; tune RBF bandwidth to reshape the boundary"
          - id: viz-smo
            title: {zh: "SMO 迭代回放", en: "SMO iteration replay"}
            interaction:
              zh: "逐步展示每次选中的一对 α 与其在约束盒中的更新轨迹"
              en: "Step through each chosen pair of α and its update path inside the box constraint"
        frontier:
          - ref: "Rahimi & Recht (2007). Random Features for Large-Scale Kernel Machines. NeurIPS."
            note: {zh: "随机特征近似核方法，连接核与两层网络", en: "Random features approximate kernels, bridging kernels and two-layer networks"}
          - ref: "Jacot, Gabriel, Hongler (2018). Neural Tangent Kernel. NeurIPS."
            note: {zh: "无限宽网络的训练等价于核回归（与第 18 章联动）", en: "Training infinitely wide networks equals kernel regression (links to Ch. 18)"}

      - id: "08"
        slug: trees-ensembles
        title: {zh: "决策树与集成学习", en: "Decision Trees and Ensemble Learning"}
        paradigm: supervised
        sources: {ISL: ["8"], LH: ["5", "8"]}
        prereqs: ["02", "04"]
        tags: {task: [classification, regression], strategy: [impurity, exponential, squared], algorithm: [greedy, stagewise]}
        goals:
          - zh: "掌握 ID3 / C4.5 / CART 的划分准则与剪枝"
            en: "Master the splitting criteria and pruning of ID3 / C4.5 / CART"
          - zh: "理解 Bagging / 随机森林如何降低方差"
            en: "Understand how bagging / random forests reduce variance"
          - zh: "把 AdaBoost 推导为指数损失下的前向分步加法模型，并推广到梯度提升"
            en: "Derive AdaBoost as forward stagewise additive modelling under exponential loss, then generalize to gradient boosting"
        triad:
          model: {zh: "轴对齐的分段常数函数 / 基学习器的加权和", en: "Axis-aligned piecewise-constant functions / weighted sums of base learners"}
          strategy: {zh: "信息增益 / 基尼指数 / 指数损失 / 任意可微损失", en: "Information gain / Gini / exponential loss / any differentiable loss"}
          algorithm: {zh: "贪心递归划分 + 代价复杂度剪枝 / 前向分步", en: "Greedy recursive splitting + cost-complexity pruning / forward stagewise"}
        derivations:
          - zh: "信息增益、信息增益比与基尼指数"
            en: "Information gain, gain ratio and the Gini index"
          - zh: "AdaBoost 训练误差指数下降的上界"
            en: "Exponentially decreasing upper bound on AdaBoost training error"
          - zh: "前向分步 + 指数损失 ⇒ AdaBoost 的权重与系数公式"
            en: "Forward stagewise + exponential loss ⇒ AdaBoost's weight and coefficient formulas"
          - zh: "梯度提升：在函数空间中做梯度下降"
            en: "Gradient boosting: gradient descent in function space"
        visuals:
          - id: viz-tree-grow
            title: {zh: "长一棵树", en: "Growing a tree"}
            interaction:
              zh: "每一步展示候选划分的增益柱状图，选中后平面被切分、树结构同步生长；可调剪枝参数 α"
              en: "Each step shows a bar chart of candidate split gains; the chosen split cuts the plane and the tree grows in sync; tune pruning α"
          - id: viz-adaboost-weights
            title: {zh: "AdaBoost 的样本权重", en: "AdaBoost sample weights"}
            interaction:
              zh: "点的大小代表权重，逐轮播放弱分类器与权重变化，同时绘制训练误差与上界"
              en: "Point size encodes weight; play rounds of weak learners and reweighting while plotting training error and its bound"
          - id: viz-bagging-variance
            title: {zh: "集成降低方差", en: "Ensembles reduce variance"}
            interaction:
              zh: "调节树的数量与特征采样比例，比较单棵树与随机森林边界的抖动程度"
              en: "Vary the number of trees and feature subsampling; compare the jitter of a single tree versus a forest"
        frontier:
          - ref: "Friedman (2001). Greedy Function Approximation: A Gradient Boosting Machine. Annals of Statistics."
            note: {zh: "梯度提升的奠基论文", en: "The founding gradient boosting paper"}
          - ref: "Chen & Guestrin (2016). XGBoost: A Scalable Tree Boosting System. KDD."
            note: {zh: "二阶近似 + 工程优化，工业标准", en: "Second-order approximation plus systems engineering; an industry standard"}
          - ref: "Grinsztajn, Oyallon, Varoquaux (2022). Why do tree-based models still outperform deep learning on typical tabular data? NeurIPS Datasets & Benchmarks."
            note: {zh: "表格数据上树模型仍占优的原因分析", en: "Why trees still win on tabular data"}

      - id: "09"
        slug: structured-prediction
        title: {zh: "结构化预测：隐马尔可夫模型与条件随机场", en: "Structured Prediction: Hidden Markov Models and Conditional Random Fields"}
        paradigm: supervised
        sources: {LH: ["10", "11"]}
        prereqs: ["05"]
        tags: {task: [sequence], strategy: [likelihood, cross-entropy], algorithm: [dp, em, newton]}
        goals:
          - zh: "掌握 HMM 的三个基本问题：概率计算、学习、预测"
            en: "Master the three HMM problems: evaluation, learning, decoding"
          - zh: "理解 HMM（生成式）与线性链 CRF（判别式）的对应关系"
            en: "Relate HMMs (generative) to linear-chain CRFs (discriminative)"
          - zh: "看清前向–后向与维特比都是网格图上的动态规划"
            en: "See forward–backward and Viterbi as dynamic programming on a trellis"
        triad:
          model: {zh: "链式概率图模型", en: "Chain-structured probabilistic graphical models"}
          strategy: {zh: "（条件）对数似然最大化", en: "Maximize (conditional) log-likelihood"}
          algorithm: {zh: "前向–后向、Baum–Welch（EM）、维特比、拟牛顿法", en: "Forward–backward, Baum–Welch (EM), Viterbi, quasi-Newton"}
        derivations:
          - zh: "前向 / 后向变量的递推及其 $O(TN^2)$ 复杂度"
            en: "Forward / backward recursions and their $O(TN^2)$ cost"
          - zh: "Baum–Welch 作为 EM 的特例（与第 11 章联动）"
            en: "Baum–Welch as a special case of EM (links to Ch. 11)"
          - zh: "线性链 CRF 的参数化形式与规范化因子的计算"
            en: "Parametric form of the linear-chain CRF and computing its partition function"
        visuals:
          - id: viz-trellis
            title: {zh: "网格图上的动态规划", en: "Dynamic programming on the trellis"}
            interaction:
              zh: "逐列点亮前向概率；切换为维特比时显示 max 与回溯指针，最终高亮最优路径"
              en: "Light up forward probabilities column by column; switch to Viterbi to show max operations, back-pointers and the final best path"
          - id: viz-hmm-vs-crf
            title: {zh: "HMM 与 CRF 的图结构", en: "Graph structure of HMM vs CRF"}
            interaction:
              zh: "并排显示有向图与无向图，悬停因子查看其参数化形式"
              en: "Directed vs undirected graphs side by side; hover a factor to see its parametrization"
        frontier:
          - ref: "Lafferty, McCallum, Pereira (2001). Conditional Random Fields. ICML."
            note: {zh: "CRF 原始论文", en: "The original CRF paper"}
          - ref: "Gu & Dao (2023). Mamba: Linear-Time Sequence Modeling with Selective State Spaces. arXiv."
            note: {zh: "现代状态空间模型：线性递推 + 并行扫描，可与 HMM 对照理解", en: "Modern state-space models — linear recurrences plus parallel scans, comparable with HMMs"}

  # ───────────────────────────────────────────────────────────────── P3
  - id: P3
    title: {zh: "第三部分：无监督学习与潜变量", en: "Part III: Unsupervised Learning and Latent Variables"}
    summary:
      zh: "没有标签时学什么？聚类、潜变量、低秩结构与采样——它们是后文生成模型的直接前身。"
      en: "What to learn without labels: clusters, latent variables, low-rank structure and sampling — the direct ancestors of modern generative models."
    chapters:
      - id: "10"
        slug: clustering
        title: {zh: "聚类", en: "Clustering"}
        paradigm: unsupervised
        sources: {ISL: ["12"], LH: ["13", "14"]}
        prereqs: ["01"]
        tags: {task: [clustering], strategy: [within-cluster], algorithm: [lloyd, greedy]}
        goals:
          - zh: "掌握 k 均值与层次聚类"
            en: "Master k-means and hierarchical clustering"
          - zh: "理解 k 均值是坐标下降、只保证局部最优"
            en: "See k-means as coordinate descent with only local optimality guarantees"
          - zh: "学会选择 k 与评价聚类"
            en: "Learn to choose k and evaluate clusterings"
        triad:
          model: {zh: "数据划分 / 簇中心", en: "A partition / set of centroids"}
          strategy: {zh: "簇内平方和最小 / 链接准则", en: "Minimize within-cluster sum of squares / linkage criterion"}
          algorithm: {zh: "Lloyd 交替最小化 / 凝聚式合并", en: "Lloyd's alternating minimization / agglomerative merging"}
        derivations:
          - zh: "Lloyd 算法每一步目标单调不增的证明"
            en: "Proof that each Lloyd step does not increase the objective"
          - zh: "k-means++ 初始化的期望近似比 $O(\\log k)$"
            en: "Expected $O(\\log k)$ approximation ratio of k-means++ seeding"
        visuals:
          - id: viz-kmeans
            title: {zh: "k 均值迭代", en: "k-means iterations"}
            interaction:
              zh: "逐步播放分配 / 更新两步，同时绘制目标函数下降曲线；对比随机与 k-means++ 初始化"
              en: "Step through assign / update with a live objective curve; compare random vs k-means++ seeding"
          - id: viz-dendrogram
            title: {zh: "树状图切割", en: "Cutting a dendrogram"}
            interaction:
              zh: "拖动水平切割线，散点图中的簇同步变化；切换单 / 全 / 平均链接"
              en: "Drag the cut line and watch clusters change in the scatter plot; switch single / complete / average linkage"
        frontier:
          - ref: "Arthur & Vassilvitskii (2007). k-means++: The Advantages of Careful Seeding. SODA."
            note: {zh: "带理论保证的初始化", en: "Seeding with a provable guarantee"}

      - id: "11"
        slug: em-mixtures
        title: {zh: "EM 算法与混合模型", en: "The EM Algorithm and Mixture Models"}
        paradigm: unsupervised
        sources: {LH: ["9"]}
        prereqs: ["00", "10"]
        tags: {task: [clustering, density], strategy: [likelihood, elbo], algorithm: [em]}
        goals:
          - zh: "从 ELBO 视角推导 EM 并证明似然单调上升"
            en: "Derive EM from the ELBO and prove monotone likelihood increase"
          - zh: "推导高斯混合模型的 E 步与 M 步"
            en: "Derive the E-step and M-step for Gaussian mixtures"
          - zh: "理解 k 均值是 GMM 的硬分配极限"
            en: "See k-means as the hard-assignment limit of a GMM"
        triad:
          model: {zh: "含潜变量的概率模型 $p(x,z|\\theta)$", en: "Latent-variable model $p(x,z|\\theta)$"}
          strategy: {zh: "边缘似然最大化（通过下界）", en: "Maximize marginal likelihood (via a lower bound)"}
          algorithm: {zh: "EM：坐标上升最大化 ELBO", en: "EM: coordinate ascent on the ELBO"}
        derivations:
          - zh: "$\\log p(x) = \\mathrm{ELBO}(q,\\theta) + \\mathrm{KL}(q\\,\\|\\,p(z|x))$"
            en: "$\\log p(x) = \\mathrm{ELBO}(q,\\theta) + \\mathrm{KL}(q\\,\\|\\,p(z|x))$"
          - zh: "E 步令 KL 为零、M 步提升下界 ⇒ 单调性"
            en: "E-step zeroes the KL, M-step raises the bound ⇒ monotonicity"
          - zh: "GEM 与 F 函数的极大–极大算法（为 VAE 铺垫）"
            en: "Generalized EM and the maximization–maximization view (setting up VAEs)"
        visuals:
          - id: viz-gmm-em
            title: {zh: "GMM 的 EM 迭代", en: "EM for a GMM"}
            interaction:
              zh: "点的颜色表示软分配责任度，椭圆逐步收敛；同步绘制对数似然曲线"
              en: "Point colour shows soft responsibilities, ellipses converge step by step, log-likelihood plotted alongside"
          - id: viz-elbo-bound
            title: {zh: "下界的贴合与上推", en: "Touching and pushing the lower bound"}
            interaction:
              zh: "一维参数下画出 $\\log p(x|\\theta)$ 与每一步的 ELBO 曲线，动画展示“贴合–上推”"
              en: "For a 1-D parameter, draw $\\log p(x|\\theta)$ and each step's ELBO, animating the touch-then-push cycle"
        frontier:
          - ref: "Dempster, Laird, Rubin (1977). Maximum Likelihood from Incomplete Data via the EM Algorithm. JRSS-B."
            note: {zh: "EM 原始论文", en: "The original EM paper"}
          - ref: "Kingma & Welling (2014). Auto-Encoding Variational Bayes. ICLR."
            note: {zh: "把 E 步换成神经网络摊销推断 ⇒ VAE（第 24 章）", en: "Replace the E-step with amortized neural inference ⇒ VAE (Ch. 24)"}

      - id: "12"
        slug: matrix-factorization
        title: {zh: "矩阵分解与降维：SVD、PCA 与潜在语义分析", en: "Matrix Factorization and Dimensionality Reduction: SVD, PCA and LSA"}
        paradigm: unsupervised
        sources: {ISL: ["12"], LH: ["15", "16", "17"]}
        prereqs: ["00"]
        tags: {task: [dim-reduction], strategy: [reconstruction], algorithm: [eigen]}
        goals:
          - zh: "证明 PCA 的“最大方差”与“最小重构误差”两种定义等价"
            en: "Prove the max-variance and min-reconstruction-error definitions of PCA coincide"
          - zh: "掌握 Eckart–Young 定理与截断 SVD"
            en: "Master the Eckart–Young theorem and truncated SVD"
          - zh: "用 LSA 理解词–文档矩阵的低秩结构"
            en: "Understand the low-rank structure of term–document matrices through LSA"
        triad:
          model: {zh: "低秩线性子空间", en: "Low-rank linear subspace"}
          strategy: {zh: "方差最大 / 重构误差最小", en: "Maximize variance / minimize reconstruction error"}
          algorithm: {zh: "特征分解 / SVD / 非负矩阵分解", en: "Eigendecomposition / SVD / non-negative matrix factorization"}
        derivations:
          - zh: "PCA：拉格朗日乘子法得到协方差矩阵特征方程"
            en: "PCA via Lagrange multipliers yields the covariance eigen-equation"
          - zh: "Eckart–Young：截断 SVD 是 Frobenius 范数下最优秩 k 近似"
            en: "Eckart–Young: truncated SVD is the best rank-k approximation in Frobenius norm"
          - zh: "NMF 的乘法更新规则"
            en: "Multiplicative update rules for NMF"
        visuals:
          - id: viz-pca-rotate
            title: {zh: "寻找主方向", en: "Finding the principal direction"}
            interaction:
              zh: "旋转投影方向，同时显示投影方差与重构误差之和恒定；松手后吸附到最优方向"
              en: "Rotate the projection axis while projected variance and reconstruction error sum to a constant; release to snap to the optimum"
          - id: viz-lowrank-image
            title: {zh: "低秩图像近似", en: "Low-rank image approximation"}
            interaction:
              zh: "拖动秩 k，图像与奇异值谱同步变化，显示压缩率"
              en: "Slide rank k to update the image and singular-value spectrum together, with the compression ratio"
          - id: viz-scree
            title: {zh: "碎石图与解释方差", en: "Scree plot and explained variance"}
            interaction:
              zh: "在真实数据集上选择主成分数，查看累计解释方差与二维投影散点"
              en: "Pick the number of components on a real dataset and see cumulative explained variance and the 2-D projection"
        frontier:
          - ref: "Halko, Martinsson, Tropp (2011). Finding Structure with Randomness. SIAM Review."
            note: {zh: "随机化 SVD：大规模低秩近似", en: "Randomized SVD for large-scale low-rank approximation"}
          - ref: "Hu et al. (2022). LoRA: Low-Rank Adaptation of Large Language Models. ICLR."
            note: {zh: "低秩分解在大模型微调中的应用", en: "Low-rank factorization for fine-tuning large models"}

      - id: "13"
        slug: markov-chains
        title: {zh: "马尔可夫链方法：MCMC、PageRank 与主题模型", en: "Markov Chain Methods: MCMC, PageRank and Topic Models"}
        paradigm: unsupervised
        sources: {LH: ["18", "19", "20", "21"]}
        prereqs: ["11", "12"]
        tags: {task: [density, ranking, clustering], strategy: [likelihood], algorithm: [mcmc, power-iteration, em]}
        goals:
          - zh: "掌握马尔可夫链的平稳分布与细致平衡条件"
            en: "Master stationary distributions and detailed balance"
          - zh: "把 PageRank 看作随机游走的平稳分布、把 MCMC 看作“设计一条以目标分布为平稳分布的链”"
            en: "See PageRank as a random walk's stationary distribution, and MCMC as designing a chain whose stationary distribution is the target"
          - zh: "理解 PLSA 与 LDA 主题模型及其吉布斯采样"
            en: "Understand PLSA and LDA topic models and their Gibbs sampler"
        triad:
          model: {zh: "马尔可夫链 / 层次贝叶斯主题模型", en: "Markov chains / hierarchical Bayesian topic models"}
          strategy: {zh: "平稳分布 / 后验推断", en: "Stationary distribution / posterior inference"}
          algorithm: {zh: "幂迭代 / Metropolis–Hastings / 吉布斯采样 / 变分 EM", en: "Power iteration / Metropolis–Hastings / Gibbs sampling / variational EM"}
        derivations:
          - zh: "细致平衡 ⇒ 平稳；M–H 接受率的推导"
            en: "Detailed balance ⇒ stationarity; deriving the M–H acceptance ratio"
          - zh: "PageRank：带阻尼的转移矩阵与 Perron–Frobenius 定理"
            en: "PageRank: the damped transition matrix and Perron–Frobenius"
          - zh: "LDA 的折叠吉布斯采样条件分布"
            en: "Collapsed Gibbs conditionals for LDA"
        visuals:
          - id: viz-mh-sampler
            title: {zh: "Metropolis–Hastings 采样器", en: "Metropolis–Hastings sampler"}
            interaction:
              zh: "在二维目标密度上观察链的轨迹，调节提议步长看接受率与混合速度的权衡"
              en: "Watch the chain wander over a 2-D target; tune proposal step size to trade acceptance rate against mixing"
          - id: viz-pagerank-surfer
            title: {zh: "随机冲浪者", en: "The random surfer"}
            interaction:
              zh: "在可编辑的小型网页图上播放随机游走，节点大小收敛到 PageRank 值；调节阻尼系数"
              en: "Play a random walk on an editable web graph; node sizes converge to PageRank; tune the damping factor"
          - id: viz-lda-topics
            title: {zh: "主题的涌现", en: "Topics emerging"}
            interaction:
              zh: "在小语料上逐轮吉布斯采样，观察词–主题分配从随机到成形"
              en: "Run Gibbs sweeps on a small corpus and watch word–topic assignments go from random to structured"
        frontier:
          - ref: "Blei, Ng, Jordan (2003). Latent Dirichlet Allocation. JMLR."
            note: {zh: "LDA 原始论文", en: "The original LDA paper"}
          - ref: "Welling & Teh (2011). Bayesian Learning via Stochastic Gradient Langevin Dynamics. ICML."
            note: {zh: "朗之万动力学采样：通往得分模型与扩散模型（第 25 章）", en: "Langevin sampling — the road to score-based and diffusion models (Ch. 25)"}

  # ───────────────────────────────────────────────────────────────── P4
  - id: P4
