        triad:
          model: {zh: "策略 $\\pi_\\theta(a|s)$ 与 / 或价值函数", en: "Policy $\\pi_\\theta(a|s)$ and / or value function"}
          strategy: {zh: "最大化期望累计回报", en: "Maximize expected cumulative return"}
          algorithm: {zh: "动态规划 / 时序差分 / 策略梯度", en: "Dynamic programming / temporal difference / policy gradient"}
        derivations:
          - zh: "贝尔曼最优算子是 γ-压缩映射 ⇒ 价值迭代收敛"
