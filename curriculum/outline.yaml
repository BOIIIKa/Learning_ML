      - id: "20"
        slug: transformers
        title: {zh: "Transformer 与注意力机制", en: "Transformers and Attention"}
        paradigm: deep
        sources: {UDL: ["12"]}
        prereqs: ["17", "19"]
        tags: {task: [sequence, generation], strategy: [cross-entropy], algorithm: [backprop, adam]}
        goals:
          - zh: "从“可微分的软查找”推出缩放点积注意力"
            en: "Derive scaled dot-product attention as a differentiable soft lookup"
          - zh: "理解多头、位置编码、层归一化与残差在 Transformer 块中的角色"
            en: "Understand multi-head attention, positional encodings, layer norm and residuals in a Transformer block"
          - zh: "区分编码器、解码器与因果掩码"
            en: "Distinguish encoders, decoders and causal masking"
        triad:
          model: {zh: "自注意力 + 前馈网络的堆叠（置换等变）", en: "Stacks of self-attention + MLP (permutation-equivariant)"}
          strategy: {zh: "下一个词元预测的交叉熵 / 掩码语言模型", en: "Next-token cross-entropy / masked language modelling"}
          algorithm: {zh: "AdamW + 预热 + 余弦调度", en: "AdamW + warm-up + cosine schedule"}
        derivations:
          - zh: "为何除以 $\\sqrt{d_k}$：点积方差分析"
            en: "Why divide by $\\sqrt{d_k}$: variance of dot products"
          - zh: "自注意力的置换等变性与位置编码的必要性；RoPE 的旋转构造"
            en: "Permutation equivariance of self-attention, why positions are needed; the rotation construction of RoPE"
          - zh: "注意力的 $O(n^2)$ 复杂度"
            en: "The $O(n^2)$ cost of attention"
        visuals:
          - id: viz-attention-matrix
            title: {zh: "交互式注意力矩阵", en: "Interactive attention matrix"}
            interaction:
              zh: "输入一句话，悬停词元查看各头注意力权重；切换因果掩码"
              en: "Type a sentence and hover tokens to see per-head attention weights; toggle the causal mask"
          - id: viz-qkv-geometry
            title: {zh: "Q、K、V 的几何", en: "Geometry of Q, K, V"}
            interaction:
              zh: "在二维中拖动查询向量，观察与各键的点积、softmax 权重与输出向量（值的凸组合）"
              en: "Drag a query in 2-D to see dot products with keys, softmax weights and the output as a convex combination of values"
          - id: viz-transformer-block
            title: {zh: "一个 Transformer 块的数据流", en: "Data flow through a Transformer block"}
            interaction:
              zh: "逐步展开张量形状变化：嵌入 → 多头注意力 → 残差与归一化 → 前馈"
              en: "Step through tensor shapes: embedding → multi-head attention → residual & norm → MLP"
        frontier:
          - ref: "Vaswani et al. (2017). Attention Is All You Need. NeurIPS."
            note: {zh: "Transformer 原始论文", en: "The original Transformer paper"}
          - ref: "Su et al. (2021). RoFormer: Enhanced Transformer with Rotary Position Embedding. arXiv."
            note: {zh: "旋转位置编码 RoPE", en: "Rotary position embedding (RoPE)"}
          - ref: "Dao, Fu, Ermon, Rudra, Ré (2022). FlashAttention. NeurIPS."
            note: {zh: "IO 感知的精确注意力", en: "IO-aware exact attention"}
          - ref: "Elhage et al. (2021). A Mathematical Framework for Transformer Circuits. Transformer Circuits Thread."
            note: {zh: "机制可解释性入门", en: "An entry point to mechanistic interpretability"}

      - id: "21"
        slug: gnn
        title: {zh: "图神经网络", en: "Graph Neural Networks"}
        paradigm: deep
        sources: {UDL: ["13"]}
        prereqs: ["13", "20"]
        tags: {task: [graph, classification], strategy: [cross-entropy], algorithm: [backprop]}
        goals:
          - zh: "从置换不变 / 等变性推出消息传递框架"
            en: "Derive message passing from permutation invariance / equivariance"
          - zh: "理解 GCN 与图拉普拉斯谱的联系，以及过平滑问题"
            en: "Connect GCNs to the graph Laplacian spectrum and understand over-smoothing"
        triad:
          model: {zh: "邻域聚合 + 更新函数", en: "Neighbourhood aggregation + update function"}
          strategy: {zh: "节点 / 边 / 图级交叉熵", en: "Node / edge / graph-level cross-entropy"}
          algorithm: {zh: "全图或采样小批量训练", en: "Full-graph or sampled mini-batch training"}
        derivations:
          - zh: "GCN 传播规则 $\\tilde D^{-1/2}\\tilde A\\tilde D^{-1/2}HW$ 的来源"
            en: "Where the GCN rule $\\tilde D^{-1/2}\\tilde A\\tilde D^{-1/2}HW$ comes from"
          - zh: "多层聚合等价于低通滤波 ⇒ 过平滑"
            en: "Repeated aggregation is low-pass filtering ⇒ over-smoothing"
        visuals:
          - id: viz-message-passing
            title: {zh: "消息传递", en: "Message passing"}
            interaction:
              zh: "在可编辑图上逐层播放邻居特征聚合，节点颜色表示特征；层数增加时观察过平滑"
              en: "Play layer-by-layer neighbour aggregation on an editable graph, colours as features; watch over-smoothing as depth grows"
        frontier:
          - ref: "Kipf & Welling (2017). Semi-Supervised Classification with Graph Convolutional Networks. ICLR."
            note: {zh: "GCN", en: "GCN"}
          - ref: "Veličković et al. (2018). Graph Attention Networks. ICLR."
            note: {zh: "GAT：图上的注意力", en: "GAT: attention on graphs"}

  # ───────────────────────────────────────────────────────────────── P6
  - id: P6
    title: {zh: "第六部分：生成模型", en: "Part VI: Generative Models"}
    summary:
      zh: "把第三部分的密度估计与潜变量思想，用深度网络推到极致。"
      en: "Pushing Part III's ideas of density estimation and latent variables to their limit with deep networks."
    chapters:
      - id: "22"
        slug: generative-gan
        title: {zh: "生成模型总览与生成对抗网络", en: "A Map of Generative Models, and GANs"}
        paradigm: generative
        sources: {UDL: ["14", "15"]}
        prereqs: ["16", "19"]
        tags: {task: [generation], strategy: [adversarial], algorithm: [sgd, adam]}
        goals:
          - zh: "用“似然是否可算、是否有潜变量、采样是否高效”三问给生成模型分类"
            en: "Classify generative models by three questions: tractable likelihood? latent variables? fast sampling?"
          - zh: "推导 GAN 的极小极大目标与 JS 散度的关系"
            en: "Derive the GAN minimax objective and its link to the JS divergence"
          - zh: "理解模式崩塌与 Wasserstein GAN"
            en: "Understand mode collapse and the Wasserstein GAN"
        triad:
          model: {zh: "生成器 $G(z)$ + 判别器 $D(x)$", en: "Generator $G(z)$ + discriminator $D(x)$"}
          strategy: {zh: "极小极大博弈", en: "Minimax game"}
          algorithm: {zh: "交替梯度下降 / 上升", en: "Alternating gradient descent / ascent"}
        derivations:
          - zh: "最优判别器 $D^*=p_{data}/(p_{data}+p_g)$ ⇒ 目标化为 JS 散度"
            en: "Optimal discriminator $D^*=p_{data}/(p_{data}+p_g)$ ⇒ objective becomes the JS divergence"
          - zh: "Wasserstein 距离的 Kantorovich–Rubinstein 对偶"
            en: "Kantorovich–Rubinstein duality for the Wasserstein distance"
        visuals:
          - id: viz-generative-map
            title: {zh: "生成模型地图", en: "Map of generative models"}
            interaction:
              zh: "可点击的分类图：GAN / 流 / VAE / 扩散 / 自回归，按三问着色并链接各章"
              en: "A clickable taxonomy of GAN / flow / VAE / diffusion / autoregressive models, coloured by the three questions and linked to chapters"
          - id: viz-gan-1d
            title: {zh: "一维 GAN 训练", en: "1-D GAN training"}
            interaction:
              zh: "实时显示真实密度、生成密度与判别器曲线的博弈；可复现模式崩塌"
              en: "Watch real density, generated density and discriminator curve compete live; reproduce mode collapse"
        frontier:
          - ref: "Goodfellow et al. (2014). Generative Adversarial Nets. NeurIPS."
            note: {zh: "GAN 原始论文", en: "The original GAN paper"}
          - ref: "Arjovsky, Chintala, Bottou (2017). Wasserstein GAN. ICML."
            note: {zh: "WGAN", en: "WGAN"}
          - ref: "Karras, Laine, Aila (2019). A Style-Based Generator Architecture for GANs. CVPR."
            note: {zh: "StyleGAN", en: "StyleGAN"}

      - id: "23"
        slug: normalizing-flows
        title: {zh: "归一化流", en: "Normalizing Flows"}
        paradigm: generative
        sources: {UDL: ["16"]}
        prereqs: ["00", "22"]
        tags: {task: [generation, density], strategy: [likelihood], algorithm: [adam]}
        goals:
          - zh: "用变量替换公式写出精确似然"
            en: "Write the exact likelihood with the change-of-variables formula"
          - zh: "理解耦合层如何同时保证可逆与雅可比行列式易算"
            en: "Understand how coupling layers keep invertibility and a cheap Jacobian determinant"
        triad:
          model: {zh: "可逆变换序列 $x=f_K\\circ\\cdots\\circ f_1(z)$", en: "Sequence of invertible maps $x=f_K\\circ\\cdots\\circ f_1(z)$"}
          strategy: {zh: "精确负对数似然", en: "Exact negative log-likelihood"}
          algorithm: {zh: "梯度下降", en: "Gradient descent"}
        derivations:
          - zh: "$\\log p(x)=\\log p(z)-\\sum_k\\log|\\det J_{f_k}|$"
            en: "$\\log p(x)=\\log p(z)-\\sum_k\\log|\\det J_{f_k}|$"
          - zh: "仿射耦合层的三角雅可比"
            en: "The triangular Jacobian of affine coupling layers"
        visuals:
          - id: viz-flow-warp
            title: {zh: "把高斯揉成月牙", en: "Kneading a Gaussian into moons"}
            interaction:
              zh: "逐层动画展示简单分布网格如何被变形为目标分布，显示局部面积缩放（行列式）"
              en: "Animate a base-distribution grid warping layer by layer into the target, with local area scaling (the determinant)"
        frontier:
          - ref: "Dinh, Sohl-Dickstein, Bengio (2017). Density Estimation using Real NVP. ICLR."
            note: {zh: "仿射耦合层", en: "Affine coupling layers"}
          - ref: "Lipman, Chen, Ben-Hamu, Nickel, Le (2023). Flow Matching for Generative Modeling. ICLR."
            note: {zh: "连续流的免模拟训练，连接流与扩散（第 25 章）", en: "Simulation-free training of continuous flows, bridging flows and diffusion (Ch. 25)"}

      - id: "24"
        slug: vae
        title: {zh: "变分自编码器", en: "Variational Autoencoders"}
        paradigm: generative
        sources: {UDL: ["17"]}
        prereqs: ["11", "22"]
        tags: {task: [generation, dim-reduction], strategy: [elbo], algorithm: [adam]}
        goals:
          - zh: "把 VAE 理解为“用神经网络做 E 步”的 EM（回链第 11 章）"
            en: "See the VAE as EM with a neural E-step (back to Ch. 11)"
          - zh: "掌握重参数化技巧"
            en: "Master the reparameterization trick"
          - zh: "理解重构项与 KL 项的权衡、后验坍塌"
            en: "Understand the reconstruction–KL trade-off and posterior collapse"
        triad:
          model: {zh: "解码器 $p_\\theta(x|z)$ + 编码器 $q_\\phi(z|x)$", en: "Decoder $p_\\theta(x|z)$ + encoder $q_\\phi(z|x)$"}
          strategy: {zh: "最大化 ELBO", en: "Maximize the ELBO"}
          algorithm: {zh: "重参数化 + 随机梯度", en: "Reparameterization + stochastic gradients"}
        derivations:
          - zh: "ELBO = 重构项 − KL 项；高斯情形下 KL 的闭式"
            en: "ELBO = reconstruction − KL; the closed-form Gaussian KL"
          - zh: "重参数化梯度 vs 得分函数（REINFORCE）梯度的方差"
            en: "Variance of reparameterization vs score-function (REINFORCE) gradients"
        visuals:
          - id: viz-latent-space
            title: {zh: "可漫游的潜空间", en: "A walkable latent space"}
            interaction:
              zh: "在二维潜空间中拖动光标，实时解码生成样本；显示各数据点编码分布的椭圆"
              en: "Drag a cursor through a 2-D latent space to decode samples live; encoder posteriors drawn as ellipses"
          - id: viz-beta-tradeoff
            title: {zh: "β 的权衡", en: "The β trade-off"}
            interaction:
              zh: "调节 KL 权重 β，观察重构质量与潜空间规整度的此消彼长"
              en: "Tune the KL weight β to trade reconstruction quality against latent-space regularity"
        frontier:
          - ref: "Kingma & Welling (2014). Auto-Encoding Variational Bayes. ICLR."
            note: {zh: "VAE 原始论文", en: "The original VAE paper"}
          - ref: "van den Oord, Vinyals, Kavukcuoglu (2017). Neural Discrete Representation Learning. NeurIPS."
            note: {zh: "VQ-VAE：离散潜变量，现代图像 / 音频分词器的基础", en: "VQ-VAE: discrete latents, the basis of modern image / audio tokenizers"}

      - id: "25"
        slug: diffusion
        title: {zh: "扩散模型", en: "Diffusion Models"}
        paradigm: generative
        sources: {UDL: ["18"]}
        prereqs: ["13", "24"]
        tags: {task: [generation], strategy: [denoising, elbo], algorithm: [adam, mcmc]}
        goals:
          - zh: "把扩散模型理解为层次化 VAE：固定的加噪编码器 + 学习的去噪解码器"
            en: "See diffusion as a hierarchical VAE: a fixed noising encoder plus a learned denoising decoder"
          - zh: "推导 ELBO 化简为噪声预测的均方误差"
            en: "Derive how the ELBO reduces to a noise-prediction MSE"
          - zh: "理解得分函数、朗之万采样与 SDE 视角，以及无分类器引导"
            en: "Understand score functions, Langevin sampling, the SDE view, and classifier-free guidance"
        triad:
          model: {zh: "去噪网络 $\\epsilon_\\theta(x_t,t)$", en: "Denoising network $\\epsilon_\\theta(x_t,t)$"}
          strategy: {zh: "去噪得分匹配（加权 ELBO）", en: "Denoising score matching (weighted ELBO)"}
          algorithm: {zh: "随机梯度训练 + 迭代采样（祖先采样 / ODE 求解器）", en: "Stochastic-gradient training + iterative sampling (ancestral / ODE solvers)"}
        derivations:
          - zh: "前向过程闭式 $q(x_t|x_0)$ 与后验 $q(x_{t-1}|x_t,x_0)$"
            en: "Closed-form forward marginal $q(x_t|x_0)$ and posterior $q(x_{t-1}|x_t,x_0)$"
          - zh: "ELBO 分解 ⇒ 简化损失 $\\|\\epsilon-\\epsilon_\\theta(x_t,t)\\|^2$"
            en: "ELBO decomposition ⇒ simplified loss $\\|\\epsilon-\\epsilon_\\theta(x_t,t)\\|^2$"
          - zh: "Tweedie 公式：去噪器即得分函数"
            en: "Tweedie's formula: the denoiser is the score"
        visuals:
          - id: viz-diffusion-2d
            title: {zh: "二维玩具扩散", en: "2-D toy diffusion"}
            interaction:
              zh: "拖动时间轴 t，粒子云在数据分布与高斯之间来回演化，叠加学到的得分向量场"
              en: "Scrub time t to morph a particle cloud between data and Gaussian, overlaid with the learned score field"
          - id: viz-sampler-compare
            title: {zh: "采样器对比", en: "Sampler comparison"}
            interaction:
              zh: "对比随机（SDE）与确定性（ODE / DDIM）采样的轨迹与步数–质量曲线"
              en: "Compare stochastic (SDE) and deterministic (ODE / DDIM) sampling trajectories and step–quality curves"
          - id: viz-cfg
            title: {zh: "无分类器引导", en: "Classifier-free guidance"}
            interaction:
              zh: "调节引导强度 w，观察多样性与保真度的权衡"
              en: "Tune guidance scale w to trade diversity against fidelity"
        frontier:
          - ref: "Ho, Jain, Abbeel (2020). Denoising Diffusion Probabilistic Models. NeurIPS."
            note: {zh: "DDPM", en: "DDPM"}
          - ref: "Song et al. (2021). Score-Based Generative Modeling through Stochastic Differential Equations. ICLR."
            note: {zh: "SDE 统一视角", en: "The unifying SDE view"}
          - ref: "Ho & Salimans (2022). Classifier-Free Diffusion Guidance. arXiv."
            note: {zh: "无分类器引导", en: "Classifier-free guidance"}
          - ref: "Rombach et al. (2022). High-Resolution Image Synthesis with Latent Diffusion Models. CVPR."
            note: {zh: "潜空间扩散（Stable Diffusion）", en: "Latent diffusion (Stable Diffusion)"}
          - ref: "Peebles & Xie (2023). Scalable Diffusion Models with Transformers. ICCV."
            note: {zh: "DiT：扩散 + Transformer", en: "DiT: diffusion + Transformers"}

  # ───────────────────────────────────────────────────────────────── P7
  - id: P7
    title: {zh: "第七部分：决策与大模型", en: "Part VII: Decision-Making and Large Models"}
    summary:
      zh: "强化学习，以及把全书拼起来的大语言模型。"
      en: "Reinforcement learning, and large language models as the synthesis of the whole course."
    chapters:
      - id: "26"
        slug: reinforcement-learning
        title: {zh: "强化学习", en: "Reinforcement Learning"}
        paradigm: rl
        sources: {UDL: ["19"]}
        prereqs: ["13", "16"]
        tags: {task: [decision], strategy: [reward], algorithm: [dp, policy-gradient, sgd]}
        goals:
