name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install numpy scikit-learn lightgbm pytest pyyaml autograd
      - name: Outline is up to date
        run: python scripts/build_outline.py --check
      - name: Exercises (solutions pass, skeletons fail)
        run: pytest -q tests

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pyyaml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: python3 ../scripts/build_exercises.py
      - run: npm test
      - run: npm run build
